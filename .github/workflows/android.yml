name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android project
        run: |
          mkdir -p web-app
          if [ ! -d android ]; then
            npx cap add android
          fi
          # capacitor-cordova-android-plugins is generated by cap add/sync and is
          # absent on a fresh checkout. settings.gradle now tolerates its absence,
          # but a stub keeps the Cordova-plugin path working too. Written with
          # printf (not a heredoc) because heredoc bodies are not indented and
          # YAML then parses their colons as top-level keys.
          if [ ! -d android/capacitor-cordova-android-plugins ]; then
            mkdir -p android/capacitor-cordova-android-plugins/src/main/java
            printf 'apply plugin: "com.android.library"\nandroid {\n    namespace "com.getcapacitor.cordova.android.plugins"\n    compileSdkVersion rootProject.ext.compileSdkVersion\n    defaultConfig {\n        minSdkVersion rootProject.ext.minSdkSdkVersion\n        targetSdkVersion rootProject.ext.targetSdkVersion\n    }\n}\n' > android/capacitor-cordova-android-plugins/build.gradle
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: godoor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error