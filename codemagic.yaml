# Codemagic build configuration for the GoDoor Android APK.
#
# The app is a Capacitor shell that loads https://godoor.site live in a WebView
# (see capacitor.config.ts -> server.url), so no web build step is needed —
# only the native Android project has to compile.
#
# To use it:
#   1. Create a free account at https://codemagic.io
#   2. Add this GitHub repo (KayembaIbrahim/godoor-platform)
#   3. Codemagic auto-detects codemagic.yaml — start a build
#   4. Download the APK from the build artifacts

workflows:
  android-apk:
    name: GoDoor Android APK
    environment:
      node: 22
      # Capacitor's Android library sets sourceCompatibility/targetCompatibility
      # to VERSION_21, so the build JDK must be 21 — Java 17 fails with
      # "invalid source release: 21".
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Prepare Android project
        script: |
          mkdir -p web-app
          # capacitor-cordova-android-plugins is generated by cap add/sync and is
          # absent on a fresh checkout. settings.gradle tolerates its absence,
          # but a stub keeps the Cordova-plugin path working too.
          if [ ! -d android/capacitor-cordova-android-plugins ]; then
            mkdir -p android/capacitor-cordova-android-plugins/src/main/java
            printf 'apply plugin: "com.android.library"\nandroid {\n    namespace "com.getcapacitor.cordova.android.plugins"\n    compileSdkVersion rootProject.ext.compileSdkVersion\n    defaultConfig {\n        minSdkVersion rootProject.ext.minSdkSdkVersion\n        targetSdkVersion rootProject.ext.targetSdkVersion\n    }\n}\n' > android/capacitor-cordova-android-plugins/build.gradle
          fi
          npx cap sync android

      - name: Build debug APK
        script: |
          cd android
          ./gradlew -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      # The APK is downloadable from the Codemagic build page under Artifacts.
      email:
        recipients:
          - ibrahimkapoor11@gmail.com
        notify:
          success: true
          failure: true
