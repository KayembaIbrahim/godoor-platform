<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* REAL mapbox-gl.css rules that position a marker */
    .mapboxgl-map { position: relative; overflow: hidden; }
    .mapboxgl-canvas { position: absolute; left: 0; top: 0; }
    .mapboxgl-marker {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
      opacity: 1;
      transition: opacity 0.2s;
    }
    /* REAL keyframes from src/app/globals.css */
    @keyframes marker-bounce {
      0%   { transform: scale(0.8); opacity: 0.6; }
      50%  { transform: scale(1.14); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes marker-ring-pulse {
      0%   { transform: scale(0.82); opacity: 0.85; }
      70%  { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }
  </style>
</head>
<body style="margin:0">
  <div id="canvas" style="position:absolute; left:0; top:0; width:400px; height:300px; background:#eee">
    <!-- OLD marker: animation + position on the element itself -->
    <div id="old" class="mapboxgl-marker" style="width:44px;height:44px;background:tomato;position:relative;transform-origin:50% 100%;transition:transform .15s;animation:marker-bounce .6s cubic-bezier(.34,1.56,.64,1) both;"></div>
    <!-- NEW marker: inert element, transforms on inner wrappers -->
    <div id="new" class="mapboxgl-marker" style="width:44px;height:44px;background:seagreen;">
      <div style="position:absolute;inset:0;transform-origin:50% 100%;transition:transform .15s">
        <div style="position:absolute;inset:0;animation:marker-bounce .6s cubic-bezier(.34,1.56,.64,1) both;background:inherit"></div>
      </div>
    </div>
    <!-- OLD user dot: infinite pulse on the element -->
    <div id="oldDot" class="mapboxgl-marker" style="width:26px;height:26px;border-radius:50%;background:#333;animation:marker-ring-pulse 2.5s ease-in-out infinite;position:relative;"></div>
    <!-- NEW user dot -->
    <div id="newDot" class="mapboxgl-marker" style="width:26px;height:26px;border-radius:50%;background:#333;">
      <div style="position:absolute;inset:-7px;border-radius:50%;border:2.5px solid #000;animation:marker-ring-pulse 2.5s ease-in-out infinite;"></div>
    </div>
  </div>
  <script>
    // Simulate what Mapbox does: write the positioning transform inline.
    window.apply = function () {
      const set = (id, x, y) => {
        const el = document.getElementById(id);
        el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`;
      };
      set('old', 120, 80);
      set('new', 120, 80);
      set('oldDot', 120, 80);
      set('newDot', 120, 80);
    };
    apply();
    setTimeout(apply, 50);
  </script>
</body>
</html>
