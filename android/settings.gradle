include ':app'

// capacitor-cordova-android-plugins is generated by `cap add`/`cap sync` and is
// absent on a fresh checkout. Including it unconditionally made every CI build
// fail with "project directory does not exist", so it is now conditional.
if (file('./capacitor-cordova-android-plugins').exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')
}

apply from: 'capacitor.settings.gradle'
