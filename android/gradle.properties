# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# This harness only has ~1 GB of RAM available, and every Capacitor plugin
# module carries its own `buildscript { classpath 'com.android.tools.build:gradle' }`
# block, so AGP gets loaded once per module (a fresh ClassLoader + native
# image each time). A large heap therefore pushes the process past what the
# kernel can commit and the daemon is OOM-killed with "Gradle build daemon
# disappeared unexpectedly" before it even prints a task line.
# Keep the daemon small and let the Kotlin compiler run in its own process
# (see kotlin.compiler.execution.strategy below) so the daemon stays lean.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Run the Kotlin compiler in a separate daemon process instead of inside the
# Gradle daemon. The global ~/.gradle/gradle.properties sets this to
# "in-process", which makes the Gradle daemon hold the whole Kotlin compiler
# in its own heap. Overriding it here keeps the Gradle daemon's footprint
# small enough to survive on a memory-constrained device.
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx320m -XX:MaxMetaspaceSize=192m

# One worker at a time: each parallel worker is another thread with its own
# buffers, and the device does not have the headroom for more.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false

# Fail fast instead of hanging forever when a Maven repository accepts the
# connection but never sends a response. Without these, a stalled TLS read
# blocks the daemon indefinitely and the build never starts.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
